<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="Legal Knowledge Pipeline: Sources, Knowledge, Skills, Application">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@500;600;700&amp;display=swap');
      .pill-text { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 13px; fill: #FFFFFF; }
      .card-title { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 14px; fill: #0F172A; }
      .card-mono { font-family: 'IBM Plex Mono', monospace; font-weight: 400; font-size: 11px; fill: #475569; }
      .badge-mono { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 11px; fill: #0369A1; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Subtle Background Grid & Connection Lines -->
  <path d="M 150 130 C 230 130, 240 85, 310 85" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 380 120 C 380 180, 290 210, 290 250" fill="none" stroke="#0EA5E9" stroke-width="2"/>
  <path d="M 330 280 C 390 280, 410 320, 410 350" fill="none" stroke="#14B8A6" stroke-width="2.5"/>
  <path d="M 160 220 C 220 220, 230 265, 260 265" fill="none" stroke="#14B8A6" stroke-width="1.75" stroke-dasharray="4 4"/>

  <!-- Card 1: Sources (EU / RIS / EUR-Lex) -->
  <g filter="url(#cardShadow)" transform="translate(28, 78)">
    <rect x="0" y="0" width="185" height="118" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="14" y="14" width="38" height="24" rx="4" fill="#0284C7"/>
    <text x="23" y="30" class="pill-text" style="font-size:11px;">EU</text>
    <rect x="60" y="14" width="44" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="70" y="30" class="badge-mono">RIS</text>
    <text x="14" y="60" class="card-title">Primary Sources</text>
    <text x="14" y="80" class="card-mono">eli:at/bgbl/1811/946</text>
    <text x="14" y="98" class="card-mono">celex:32016R0679</text>
  </g>

  <!-- Pill: Sources -->
  <g transform="translate(52, 48)">
    <rect x="0" y="0" width="96" height="30" rx="15" fill="#0284C7"/>
    <circle cx="18" cy="15" r="4" fill="#38BDF8"/>
    <text x="30" y="20" class="pill-text">Sources</text>
  </g>

  <!-- Card 2: Knowledge (Top Right) -->
  <g filter="url(#cardShadow)" transform="translate(275, 42)">
    <rect x="0" y="0" width="245" height="136" rx="12" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5"/>
    <rect x="0" y="0" width="245" height="34" rx="12" fill="#F0F9FF"/>
    <text x="16" y="22" class="badge-mono">id: gdpr-art-30 · v1.0.0</text>
    <text x="16" y="60" class="card-title">Structured Knowledge</text>
    <text x="16" y="82" class="card-mono">kind: legal_requirement</text>
    <text x="16" y="100" class="card-mono">status: CURATED_ANALYSIS</text>
    <text x="16" y="118" class="card-mono">sha256: 8f9c...3e2a (verified)</text>
  </g>

  <!-- Pill: Knowledge -->
  <g transform="translate(300, 14)">
    <rect x="0" y="0" width="114" height="30" rx="15" fill="#0EA5E9"/>
    <circle cx="18" cy="15" r="4" fill="#FFFFFF"/>
    <text x="30" y="20" class="pill-text">Knowledge</text>
  </g>

  <!-- Card 3: Statutory Node (§) -->
  <g filter="url(#cardShadow)" transform="translate(54, 226)">
    <rect x="0" y="0" width="150" height="110" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#F0F9FF"/>
    <text x="27" y="41" style="font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:22px;fill:#0284C7;">§</text>
    <text x="16" y="74" class="card-title">Citation Graph</text>
    <text x="16" y="94" class="card-mono">Impact Analysis</text>
  </g>

  <!-- Card 4: Skills (Center) -->
  <g filter="url(#cardShadow)" transform="translate(232, 212)">
    <rect x="0" y="0" width="210" height="112" rx="12" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
    <text x="16" y="46" class="card-title">Reusable Legal Skills</text>
    <text x="16" y="68" class="card-mono">✓ Minimum Requirements</text>
    <text x="16" y="86" class="card-mono">✓ Jurisdiction Check</text>
    <text x="16" y="102" class="card-mono">✓ Governance Gate</text>
  </g>

  <!-- Pill: Skills -->
  <g transform="translate(252, 186)">
    <rect x="0" y="0" width="84" height="30" rx="15" fill="#0D9488"/>
    <circle cx="18" cy="15" r="4" fill="#5EEAD4"/>
    <text x="30" y="20" class="pill-text">Skills</text>
  </g>

  <!-- Card 5: Application (Bottom Right) -->
  <g filter="url(#cardShadow)" transform="translate(305, 344)">
    <rect x="0" y="0" width="225" height="82" rx="12" fill="#0F172A" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="18" y="34" style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:14px;fill:#F3F4F6;">Practical Solutions</text>
    <text x="18" y="56" style="font-family:'IBM Plex Mono',monospace;font-size:11px;fill:#5EEAD4;">Model-independent · Governed</text>
  </g>

  <!-- Pill: Application -->
  <g transform="translate(402, 320)">
    <rect x="0" y="0" width="116" height="30" rx="15" fill="#14B8A6"/>
    <circle cx="18" cy="15" r="4" fill="#0F172A"/>
    <text x="30" y="20" class="pill-text" style="fill:#0F172A;">Application</text>
  </g>
</svg>
